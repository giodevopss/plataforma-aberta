name: Actual private Windows WSL runtime acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-wsl:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - name: Test actual Microsoft WSL and independent own distro
        shell: pwsh
        env:
          PA_OWN_VM_ACCEPTANCE: '1'
        run: |
          $env:PA_TEST_MANAGED_ROOT = Join-Path $env:RUNNER_TEMP "pa-owned-wsl"
          New-Item -ItemType Directory -Path $env:PA_TEST_MANAGED_ROOT -Force | Out-Null
          node suite/tests/managed-runtime-native.mjs
      - name: Preserve small synthetic runtime acceptance or concrete host blocker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: own-wsl-native
          path: suite/research/managed-runtime-native/
          retention-days: 1
          if-no-files-found: error
