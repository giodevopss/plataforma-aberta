name: Actual private Mac guest runtime acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-mac:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - name: Test actual original Lima VZ guest and independent cold recovery
        env:
          PA_OWN_VM_ACCEPTANCE: '1'
        run: |
          export PA_TEST_MANAGED_ROOT="$RUNNER_TEMP/pa-vm"
          mkdir -p "$PA_TEST_MANAGED_ROOT"
          node suite/tests/managed-runtime-native.mjs
      - name: Preserve small synthetic acceptance or concrete runner limitation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: own-vm-${{ matrix.runner }}
          path: suite/research/managed-runtime-native/
          retention-days: 1
          if-no-files-found: error
