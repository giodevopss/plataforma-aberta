name: Original presentation first-boot account readiness across three fresh instances
on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        default: arm
        options: [arm, intel, both]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.architecture == 'arm' && '["ubuntu-24.04-arm"]' || inputs.architecture == 'both' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - run: node suite/tests/presenton-startup-cloud.mjs
      - name: Preserve only synthetic first-boot status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-presenton-startup-${{ matrix.runner }}
          path: suite/research/presenton-startup/acceptance.json
          retention-days: 1
          if-no-files-found: error
