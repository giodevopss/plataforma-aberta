name: Cumulative exact original images in one actual owned Windows guest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PA_OWN_VM_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - run: node suite/tests/runtime-images-cloud.mjs
      - name: Preserve only small synthetic image/resource diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: own-windows-cumulative-images
          path: suite/research/runtime-images/acceptance.json
          retention-days: 1
          if-no-files-found: error
