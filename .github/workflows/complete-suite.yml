name: All twelve originals through one complete encrypted product recovery
on:
  workflow_dispatch:
    inputs:
      native_target:
        description: Actual owned native Linux guest target
        type: choice
        default: windows
        options: [windows, mac-intel]
      installer_tag:
        description: Accepted matching native installer tag; empty runs the source shell
        type: string
        default: ''
permissions:
  contents: read
jobs:
  complete-suite:
    runs-on: ${{ inputs.native_target == 'mac-intel' && 'macos-15-intel' || 'windows-2025' }}
    timeout-minutes: ${{ inputs.native_target == 'mac-intel' && 330 || 180 }}
    env:
      PA_INTERNAL_INSTALLER_VALIDATION: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Prepare original fixture browser
        working-directory: desktop
        run: npx playwright install chromium
      - name: Restore only fully verified original engines and native components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/public-assets.mjs restore
          node scripts/distribution/prepare-electron.mjs
          node scripts/distribution/prepare-public-native.mjs
      - name: Verify the previously accepted installer and product source ancestry
        if: inputs.installer_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PA_ACCEPTED_INSTALLER_TAG: ${{ inputs.installer_tag }}
        shell: bash
        run: node scripts/distribution/restore-tested-installer.mjs "$PA_ACCEPTED_INSTALLER_TAG"
      - name: Install accepted package into this disposable runner
        if: inputs.installer_tag != ''
        id: install
        run: node scripts/distribution/installer-validation.mjs install
      - name: Original workflows, one private Linux guest, twelve providers and unified activation
        env:
          PA_OWN_VM_ACCEPTANCE: '1'
        run: node suite/tests/complete-suite-cloud.mjs
      - name: Uninstall only this recorded internal package
        if: always() && steps.install.outcome == 'success'
        run: node scripts/distribution/installer-validation.mjs uninstall
      - name: Preserve only the small public synthetic acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-twelve-provider-recovery
          path: suite/research/complete-suite/acceptance.json
          retention-days: 1
          if-no-files-found: error
