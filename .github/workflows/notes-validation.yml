name: Original browser-local AFFiNE notes through unified product recovery
on:
  workflow_dispatch:
    inputs:
      native_target:
        type: choice
        default: linux
        options: [all, linux, windows]
permissions:
  contents: read
jobs:
  notes:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_target == 'linux' && '["ubuntu-24.04"]' || inputs.native_target == 'windows' && '["windows-2025"]' || '["ubuntu-24.04","windows-2025"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Restore independently verified complete desktop engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/public-assets.mjs restore
          node scripts/distribution/prepare-electron.mjs
      - name: Original local document, account cookies and real product encrypted recovery
        env:
          PA_OWN_VM_ACCEPTANCE: '1'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node suite/tests/notes-cloud.mjs; else node suite/tests/notes-cloud.mjs; fi
      - name: Preserve small synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-local-notes-${{ matrix.runner }}
          path: suite/research/cloud-affine/
          retention-days: 1
          if-no-files-found: error
