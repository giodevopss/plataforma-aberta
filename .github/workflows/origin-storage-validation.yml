name: All original browser storage types across independent native origins
on:
  workflow_dispatch:
    inputs:
      native_target:
        type: choice
        default: all
        options: [all, linux, windows, macos-arm, macos-intel]
permissions:
  contents: read
jobs:
  browser-storage:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_target == 'linux' && '["ubuntu-24.04"]' || inputs.native_target == 'windows' && '["windows-2025"]' || inputs.native_target == 'macos-arm' && '["macos-15"]' || inputs.native_target == 'macos-intel' && '["macos-15-intel"]' || '["ubuntu-24.04","macos-15","macos-15-intel","windows-2025"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: node scripts/distribution/prepare-electron.mjs
      - name: Actual independent browser-local recovery
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node suite/tests/origin-storage-native.mjs; else node suite/tests/origin-storage-native.mjs; fi
      - name: Preserve small synthetic results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-browser-types-${{ matrix.runner }}
          path: suite/research/origin-storage-native/acceptance.json
          retention-days: 1
          if-no-files-found: error
