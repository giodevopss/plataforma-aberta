name: Complete original automation worker workflow and recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - name: Restore verified original native shell engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/public-assets.mjs restore
          node scripts/distribution/prepare-electron.mjs
      - name: Original automation, native view, real worker executions and encrypted independent recovery
        env:
          PA_TEST_NATIVE_SERVICE: '1'
        run: xvfb-run -a node suite/tests/automation-cloud.mjs
      - name: Preserve small synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-automation-worker
          path: suite/research/cloud-activepieces/
          retention-days: 1
          if-no-files-found: error
