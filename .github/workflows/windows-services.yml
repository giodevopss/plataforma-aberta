name: Original service workflows through actual owned Windows WSL
on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        default: all
        options: [all, paperless, formbricks, plane, postiz]
permissions:
  contents: read
jobs:
  original-service:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: ${{ fromJSON(inputs.service == 'paperless' && '["paperless"]' || inputs.service == 'formbricks' && '["formbricks"]' || inputs.service == 'plane' && '["plane"]' || inputs.service == 'postiz' && '["postiz"]' || '["paperless","formbricks","plane","postiz"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Prepare original test browser
        working-directory: desktop
        run: npx playwright install chromium
      - name: Restore independently verified original desktop engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/public-assets.mjs restore
          node scripts/distribution/prepare-electron.mjs
      - name: Test original accounts, actual Windows native view, restart and cold independent recovery
        env:
          PA_OWN_VM_ACCEPTANCE: '1'
          PA_TEST_NATIVE_SERVICE: '1'
        shell: pwsh
        run: |
          if ('${{ matrix.service }}' -eq 'paperless') { node suite/tests/paperless-cloud.mjs }
          else { node suite/tests/remaining-services-cloud.mjs '${{ matrix.service }}' }
      - name: Preserve small fresh synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: own-windows-${{ matrix.service }}
          path: suite/research/cloud-${{ matrix.service }}/
          retention-days: 1
          if-no-files-found: error
