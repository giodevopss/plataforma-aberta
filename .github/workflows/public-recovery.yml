name: Complete native encrypted recovery UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Restore verified public original engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/public-assets.mjs restore
          node scripts/distribution/prepare-electron.mjs
      - name: Verify actual original editors and independent recovery
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node suite/tests/desktop-recovery-native.mjs
          else
            node suite/tests/desktop-recovery-native.mjs
          fi
      - name: Preserve small fresh synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-recovery-${{ matrix.runner }}
          path: suite/research/desktop-recovery-native/
          retention-days: 1
          if-no-files-found: error
