name: Internal native installer validation
on:
  workflow_dispatch:
    inputs:
      native_target:
        description: Installer targets to compile and accept
        type: choice
        default: all
        options: [all, windows, macos-arm, macos-intel]
permissions:
  contents: read
concurrency:
  group: internal-installer-validation
  cancel-in-progress: false
jobs:
  installer:
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_target == 'windows' && '["windows-2025"]' || inputs.native_target == 'macos-arm' && '["macos-15"]' || inputs.native_target == 'macos-intel' && '["macos-15-intel"]' || '["macos-15","macos-15-intel","windows-2025"]') }}
    env:
      PA_INTERNAL_INSTALLER_VALIDATION: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked build dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Fresh evidence and official Electron installation
        run: |
          node scripts/distribution/reset-ci-evidence.mjs
          node scripts/distribution/prepare-electron.mjs
      - name: Restore verified engines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/public-assets.mjs restore
      - name: Restore accepted complete native applications
        run: node scripts/distribution/prepare-public-native.mjs
      - name: Prepare original target runtime binaries
        run: node desktop/scripts/prepare-platform-runtime.mjs
      - name: Build internal native installer
        run: node scripts/distribution/installer-validation.mjs build
      - name: Install into disposable runner
        id: install
        run: node scripts/distribution/installer-validation.mjs install
      - name: Validate installed application workflows
        working-directory: desktop
        run: npm run test:desktop
      - name: Verify installed encrypted backup and independent activation
        run: node suite/tests/desktop-recovery-native.mjs
      - name: Uninstall the tested application
        if: always() && steps.install.outcome == 'success'
        run: node scripts/distribution/installer-validation.mjs uninstall
      - name: Preserve accepted installer without metered Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution/publish-public-installer.mjs
      - name: Preserve internal QA package and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-installer-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: |
            desktop/research/
            suite/research/desktop-recovery-native/
          retention-days: 1
          if-no-files-found: error
