name: Internal native installer validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: internal-installer-validation
  cancel-in-progress: false
jobs:
  installer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2025]
    env:
      PA_INTERNAL_INSTALLER_VALIDATION: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked build dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Fresh evidence and official Electron installation
        run: |
          node scripts/distribution/reset-ci-evidence.mjs
          node scripts/distribution/prepare-electron.mjs
      - name: Restore verified engines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/public-assets.mjs restore
      - name: Build internal native installer
        run: node scripts/distribution/installer-validation.mjs build
      - name: Install into disposable runner
        run: node scripts/distribution/installer-validation.mjs install
      - name: Validate installed application workflows
        working-directory: desktop
        run: npm run test:desktop
      - name: Uninstall the tested application
        if: always()
        run: node scripts/distribution/installer-validation.mjs uninstall
      - name: Preserve internal QA package and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-installer-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: |
            desktop/release/Plataforma-Aberta-*.dmg
            desktop/release/Plataforma-Aberta-*.exe
            desktop/release/SHA256SUMS
            desktop/research/
          retention-days: 1
          if-no-files-found: error
