name: Restored workers isolated from host and external networks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - name: Positive host control, production isolated runtime and targeted cleanup
        run: node suite/tests/verification-network-cloud.mjs
      - name: Preserve small synthetic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restored-worker-network-isolation
          path: suite/research/cloud-verification/acceptance.json
          retention-days: 1
          if-no-files-found: error
