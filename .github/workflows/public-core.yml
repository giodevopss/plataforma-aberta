name: Public core and recovery tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - name: Fresh report directory
        run: node scripts/distribution/reset-ci-evidence.mjs
      - name: Full unit and storage recovery tests
        working-directory: desktop
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=research/unit-tests.xml tests/*.test.mjs
      - name: Save small fresh test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-core-${{ matrix.runner }}
          path: desktop/research/unit-tests.xml
          retention-days: 1
          if-no-files-found: error
