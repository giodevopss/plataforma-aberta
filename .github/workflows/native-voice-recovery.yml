name: Original native voice history models and recovery
on:
  workflow_dispatch:
    inputs:
      native_target:
        type: choice
        default: all
        options: [all, windows, macos-arm, macos-intel]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.native_target == 'windows' && '["windows-2025"]' || inputs.native_target == 'macos-arm' && '["macos-15"]' || inputs.native_target == 'macos-intel' && '["macos-15-intel"]' || '["macos-15","macos-15-intel","windows-2025"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.12.0
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - run: node scripts/distribution/prepare-public-native.mjs openwhispr
      - name: Actual original app history audio and independent encrypted recovery
        run: node suite/tests/openwhispr-recovery-native.mjs
      - name: Preserve small synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-voice-recovery-${{ matrix.runner }}
          path: suite/research/openwhispr-recovery-native/
          retention-days: 1
          if-no-files-found: error
